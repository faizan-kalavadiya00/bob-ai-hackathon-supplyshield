submission:
  title: "SupplyShield — AI Supply Chain Resilience Operating System"

  problem_statement: >
    Supply Chain Disruption Assistant & Fleet Utilisation Optimizer

  solution_summary: >
    SupplyShield is an AI-powered supply-chain resilience operating system
    that connects disruption detection, cascade analysis, the Resilience Risk
    Index and multidimensional Resilience Wallet with what-if simulation,
    route optimization, cold-chain monitoring, recovery planning, human
    approvals and auditability. Deterministic operational intelligence
    provides the source of truth while IBM watsonx.ai can provide
    natural-language explanations and decision context.

  key_features:
    - "Disruption Command Center with Disruption DNA, historical similarity and cascade impact analysis"
    - "Multidimensional Resilience Wallet measuring TIME, COST, TEMPERATURE and CAPACITY resilience"
    - "Risk-weighted Fleet & Route Optimization with alternative route evaluation"
    - "Disruption Simulation with deterministic BEFORE vs AFTER resilience and exposure analysis"
    - "Recovery Planning with Human-in-the-Loop approvals and a complete Audit Log"

  tech_stack:
    languages:
      - "Python"
      - "TypeScript"
    frameworks:
      - "FastAPI"
      - "React 18"
      - "Vite"
      - "Tailwind CSS"
      - "SQLAlchemy"
      - "Pydantic"
    ibm_technologies:
      - "IBM watsonx.ai"
    databases:
      - "PostgreSQL"
    other:
      - "REST API"
      - "GitHub"
      - "Docker"

  what_we_are_most_proud_of: >
    We are most proud of turning supply-chain disruption management into one
    connected decision workflow rather than a collection of dashboards.
    SupplyShield does not stop at identifying risk: it explains the disruption,
    quantifies resilience consumption across four dimensions, evaluates what-if
    scenarios, ranks recovery actions, keeps humans in control of high-impact
    decisions and records those decisions through an audit trail. The
    deterministic resilience engine remains the source of truth while
    watsonx.ai adds an explainable natural-language intelligence layer.

  known_limitations: >
    The current hackathon implementation uses seeded operational and IoT-style
    demonstration data rather than live carrier, logistics or physical sensor
    integrations. The watsonx.ai layer is optional and requires configured
    credentials; the core deterministic resilience and decision-support
    functionality remains available without it. Route and recovery actions
    are recommendations and approval records rather than direct execution
    against external logistics systems.

